# Le plan gratuit de Supabase met en pause un projet sans activité pendant 7 jours.
# Cette tâche interroge la base tous les 3 jours (lecture du calendrier public, sans donnée personnelle) pour l'éviter.
name: Garder Supabase actif

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroger la base
        run: |
          URL=$(python3 -c "import json;print(json.load(open('src/donnees/site.json'))['supabase_url'])")
          KEY=$(python3 -c "import json;print(json.load(open('src/donnees/site.json'))['supabase_anon_key'])")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase pas encore configuré"; exit 0; fi
          AUJ=$(date -u +%F); FIN=$(date -u -d "+7 days" +%F)
          curl -sf -X POST "$URL/rest/v1/rpc/calendrier_public" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d "{\"p_debut\":\"$AUJ\",\"p_fin\":\"$FIN\"}" > /dev/null
          echo "Base interrogée avec succès"
